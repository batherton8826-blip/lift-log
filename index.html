<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* Layout: one phone-width column. Body numbers first, then one card per lift
     showing the previous session next to today's entry boxes, settings last. */
  :root {
    --bg: #eef0ee; --surface: #ffffff; --surface-2: #f5f7f5; --ink: #14191c; --muted: #59636a; --line: #d5dad7;
    --accent: #1d4ed8; --accent-ink: #ffffff;
    --up: #116b34; --up-bg: #e1f3e6; --down: #b0281c; --down-bg: #fbe5e2; --same: #4a545b; --same-bg: #e7eae8;
    --track: #dde2df; --warn-bg: #fff3d6; --warn-ink: #6b4a00;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1316; --surface: #171d21; --surface-2: #1e262b; --ink: #eceff1; --muted: #97a2a9; --line: #2b353b;
      --accent: #7aa2ff; --accent-ink: #0b1220;
      --up: #5fe08d; --up-bg: #15301f; --down: #ff9a8b; --down-bg: #3a1c19; --same: #b4bec4; --same-bg: #262f34;
      --track: #28323a; --warn-bg: #3a2f10; --warn-ink: #f3d58a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1316; --surface: #171d21; --surface-2: #1e262b; --ink: #eceff1; --muted: #97a2a9; --line: #2b353b;
    --accent: #7aa2ff; --accent-ink: #0b1220;
    --up: #5fe08d; --up-bg: #15301f; --down: #ff9a8b; --down-bg: #3a1c19; --same: #b4bec4; --same-bg: #262f34;
    --track: #28323a; --warn-bg: #3a2f10; --warn-ink: #f3d58a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 var(--body);
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1, h2, h3, p { margin: 0; }

  .eyebrow { color: var(--muted); font-size: 0.875rem; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { font: 700 2.25rem/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.01em; text-wrap: balance; }
  .status { color: var(--muted); font-size: 0.875rem; margin-top: -8px; }

  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 12px 14px; }

  h2 { font: 700 1.5rem/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
  .sec { display: flex; flex-direction: column; gap: 12px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .sec-head span { color: var(--muted); font-size: 0.875rem; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; }
  .lab { color: var(--muted); font-size: 0.8125rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .big { font: 700 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .big small { font: 600 1rem/1 var(--body); color: var(--muted); }
  .sub { color: var(--muted); font-size: 0.875rem; }
  .bar { height: 10px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width 0.3s ease; }
  .bar.over i { background: var(--down); }
  .bar.done i { background: var(--up); }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr)); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }
  input, textarea {
    width: 100%; min-width: 0; padding: 0 10px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    font: 600 1.25rem var(--display); font-variant-numeric: tabular-nums;
  }
  input { height: 48px; }
  input.text, textarea { font: 500 1rem var(--body); }
  textarea { padding: 10px; min-height: 120px; resize: vertical; line-height: 1.4; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.7; font-weight: 500; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button {
    min-height: 48px; padding: 0 18px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font: 600 1rem var(--body);
  }
  button.quiet { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .lifts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 12px; }
  .lift-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h3 { font: 700 1.5rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
  .pill { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--up-bg); color: var(--up); white-space: nowrap; }
  .prev { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .prevnums { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .prevnums b { font: 700 1.5rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .prevnums span { font: 600 1.125rem var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
  .entry { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; gap: 8px; }
  .gain { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 28px; font-size: 0.875rem; color: var(--muted); }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 9px; border-radius: 999px; font: 600 0.9375rem var(--body); font-variant-numeric: tabular-nums; }
  .chip small { font-size: 0.6875rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.85; }
  .chip.up { background: var(--up-bg); color: var(--up); }
  .chip.down { background: var(--down-bg); color: var(--down); }
  .chip.same { background: var(--same-bg); color: var(--same); }
  .hint { font-size: 0.875rem; color: var(--warn-ink); background: var(--warn-bg); border-radius: 8px; padding: 8px 10px; flex-basis: 100%; }
  .msg { font-size: 0.875rem; min-height: 1.2em; }
  .msg.ok { color: var(--up); }
  .msg.err { color: var(--down); }
  .foot { color: var(--muted); font-size: 0.8125rem; }

  details.panel summary { font: 700 1.5rem/1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; cursor: pointer; min-height: 32px; display: flex; align-items: center; }
  details.panel[open] summary { margin-bottom: 4px; }
  .group { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .group h3 { font-size: 1.125rem; }
  select {
    width: 100%; min-width: 0; height: 48px; padding: 0 10px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; font: 500 1rem var(--body);
  }
  select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .feel { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .feel button { min-height: 48px; padding: 0 4px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font: 600 0.875rem var(--body); }
  .feel button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .calc { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .keyrow { display: flex; gap: 8px; }
  .keyrow input { flex: 1 1 auto; min-width: 0; }
  .keyrow button { flex: 0 0 auto; min-width: 84px; }
  .calc b { font: 700 1.75rem/1 var(--display); font-variant-numeric: tabular-nums; }

  /* Progress charts: one line chart at a time, drawn as inline SVG (no library). */
  .picker { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .picker::-webkit-scrollbar { display: none; }
  .picker button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font: 600 0.9375rem var(--body); }
  .picker button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .readout { display: flex; align-items: center; gap: 10px; min-height: 96px; }
  .readout .rv { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .readout b { font: 700 1.75rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .readout .step { flex: 0 0 auto; min-width: 44px; min-height: 44px; padding: 0; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-size: 1.25rem; }
  .readout .step[aria-disabled="true"] { opacity: 0.4; }
  .chartbox { width: 100%; max-width: 640px; margin: 0 auto; }
  .chart { width: 100%; height: auto; display: block; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .ch-grid { stroke: var(--line); stroke-width: 1; }
  .ch-tick { fill: var(--muted); font: 500 12px var(--body); }
  .ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ch-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .ch-cx { stroke: var(--muted); stroke-width: 1; }
  .tblwrap summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font: 600 0.9375rem var(--body); color: var(--muted); }
  .tblscroll { max-height: 260px; overflow: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
  table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.tbl th { color: var(--muted); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; position: sticky; top: 0; background: var(--surface); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
  "use strict";

  var STORE_KEY = "liftlog-v1";
  var KG_PER_LB = 0.45359237;
  var DEFAULT_LIFTS = ["Squat", "Chest", "Biceps", "Triceps", "Shoulders"];
  var LABELS = {
    name: "Name",
    calNeed: "Daily calories needed (kcal)",
    calGoal: "Daily calorie intake goal (kcal)",
    stepGoal: "Daily step goal",
    startWeight: "Starting weight (kg)",
    sex: "Sex",
    age: "Age",
    heightCm: "Height (cm)",
    activity: "Activity level"
  };
  var FEEL = ["Rough", "Low", "Okay", "Good", "Great"];
  var ACTIVITY = [
    { id: "sedentary", f: 1.2, label: "Sedentary: desk job, little exercise" },
    { id: "light", f: 1.375, label: "Lightly active: exercise 1 to 3 days a week" },
    { id: "moderate", f: 1.55, label: "Moderately active: exercise 3 to 5 days a week" },
    { id: "very", f: 1.725, label: "Very active: hard exercise 6 to 7 days a week" },
    { id: "extra", f: 1.9, label: "Extra active: physical job plus hard training" }
  ];

  function freshSettings() {
    return { name: "", calNeed: null, calGoal: null, stepGoal: null, startWeight: null, sex: "", age: null, heightCm: null, activity: "", lifts: DEFAULT_LIFTS.slice() };
  }
  var store = { lifts: [], body: [], steps: [], settings: freshSettings(), settingsDirty: false, sync: { url: "", key: "" }, uid: 1, lastSync: null };
  var ui = { touched: {}, msgs: {}, busy: {}, syncing: false, syncError: null, settingsOpen: false, storageWarn: false, renderedDate: "", feel: null, showKey: false, chart: null, metric: "weight", sel: null, tableOpen: false };

  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayISO() {
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }
  function fmtDate(iso, opts) {
    var p = iso.split("-").map(Number);
    var o = Object.assign({ timeZone: "UTC" }, opts);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2])).toLocaleDateString("en-GB", o);
  }
  function longDate(iso) { return fmtDate(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" }); }
  function shortDate(iso) { return fmtDate(iso, { weekday: "short", day: "numeric", month: "short" }); }
  function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "lift"; }
  function num(x) {
    if (x == null || x === "") return null;
    var n = parseFloat(String(x).replace(/,/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  function normDate(x) {
    var s = String(x == null ? "" : x).replace(/^'/, "").trim();
    var m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);
    if (m) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);
    m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(s);
    if (m) return m[3] + "-" + pad(m[2]) + "-" + pad(m[1]);
    return null;
  }
  function kg(n) { return String(parseFloat(Number(n).toFixed(2))); }
  function fmtInt(n) { return Math.round(n).toLocaleString("en-GB"); }
  function stLb(kgVal) {
    var lb = Math.round(kgVal / KG_PER_LB);
    return Math.floor(lb / 14) + " st " + (lb % 14) + " lb";
  }
  function byDate(a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.seq - b.seq; }
  function time(ms) { return new Date(ms).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }); }

  function feelVal(x) {
    var n = num(x);
    return n != null && Number.isInteger(n) && n >= 1 && n <= 5 ? n : null;
  }
  function gainText(prev, w, reps) {
    if (!prev || prev.reps.some(function (r) { return r == null; })) return "";
    var dw = w - prev.weight;
    var dr = reps[0] + reps[1] + reps[2] - (prev.reps[0] + prev.reps[1] + prev.reps[2]);
    if (dw === 0 && dr === 0) return "Same as last time.";
    var parts = [];
    if (dw !== 0) parts.push((dw > 0 ? "up " : "down ") + kg(Math.abs(dw)) + " kg");
    if (dr !== 0) parts.push((dr > 0 ? "up " : "down ") + Math.abs(dr) + " reps");
    return "Compared with last time: " + parts.join(" and ") + ".";
  }

  /* ---------- maintenance calories (Mifflin-St Jeor) ---------- */
  function readCalc() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
    var lw = latestWeight();
    var wt = lw ? lw.weight : store.settings.startWeight;
    var age = num(g("s-age")), h = num(g("s-height")), sex = g("s-sex"), act = g("s-activity");
    var a = ACTIVITY.filter(function (x) { return x.id === act; })[0];
    if (wt == null) return { ready: false, why: "Log your weight or set a starting weight first." };
    if (!sex || age == null || h == null || !a) return { ready: false, why: "Choose sex, age, height and activity level to see the result." };
    if (age < 10 || age > 100 || h < 100 || h > 250) return { ready: false, why: "Check the age and height." };
    var bmr = 10 * wt + 6.25 * h - 5 * age + (sex === "male" ? 5 : -161);
    return { ready: true, wt: wt, bmr: bmr, maint: bmr * a.f, a: a };
  }
  function updateCalc() {
    var box = document.getElementById("calc");
    if (!box) return;
    var c = readCalc();
    if (!c.ready) { box.innerHTML = '<span class="sub">' + esc(c.why) + "</span>"; return; }
    var goal = num((document.getElementById("s-goal") || {}).value);
    var h = '<span class="lab">Maintenance calories</span><b>' + fmtInt(c.maint) + ' kcal a day</b>' +
      '<span class="sub">Resting rate (BMR) ' + fmtInt(c.bmr) + " kcal, times " + c.a.f + " for activity. Based on " + kg(c.wt) + " kg.</span>";
    if (goal != null && goal < c.bmr) {
      h += '<span class="sub">The calorie goal is below the resting rate. A gap that large is best agreed with a doctor or dietitian.</span>';
    }
    box.innerHTML = h;
  }
  function useCalc() {
    var c = readCalc(), note = document.getElementById("calc-note");
    if (!note) return;
    if (!c.ready) { note.textContent = c.why; note.className = "msg err"; return; }
    document.getElementById("s-need").value = Math.round(c.maint);
    ui.touched["s-need"] = true;
    note.textContent = "Filled in. Tap Save settings to keep it.";
    note.className = "msg ok";
  }

  /* ---------- storage on this phone ---------- */
  function loadStore() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (!s || typeof s !== "object") return;
      store.lifts = Array.isArray(s.lifts) ? s.lifts : [];
      store.body = Array.isArray(s.body) ? s.body : [];
      store.body.forEach(function (r) { if (r.feel === undefined) r.feel = null; delete r.steps; });
      store.steps = Array.isArray(s.steps) ? s.steps : [];
      store.settings = Object.assign(freshSettings(), s.settings || {});
      if (!Array.isArray(store.settings.lifts) || !store.settings.lifts.length) store.settings.lifts = DEFAULT_LIFTS.slice();
      store.sync = Object.assign({ url: "", key: "" }, s.sync || {});
      store.settingsDirty = !!s.settingsDirty;
      store.uid = s.uid || 1;
      store.lastSync = s.lastSync || null;
    } catch (e) { /* start fresh */ }
  }
  function saveStore() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); ui.storageWarn = false; }
    catch (e) { ui.storageWarn = true; }
  }

  /* ---------- Google Sheet sync through the Apps Script web app ---------- */
  async function api(action, payload) {
    var ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 25000) : null;
    var res;
    try {
      res = await fetch(store.sync.url, {
        method: "POST",
        body: JSON.stringify(Object.assign({ key: store.sync.key, action: action }, payload || {})),
        signal: ctrl ? ctrl.signal : undefined,
        redirect: "follow"
      });
    } catch (e) { throw { code: "network" }; }
    finally { if (timer) clearTimeout(timer); }
    var data;
    try { data = await res.json(); } catch (e) { throw { code: "badresponse" }; }
    if (!data || data.ok !== true) throw { code: "server", message: (data && data.error) || "unknown error" };
    return data;
  }
  function syncErrText(e) {
    switch (e && e.code) {
      case "network": return "Couldn't reach your sheet. Check your internet connection and the web app URL in Settings.";
      case "badresponse": return "The web app URL didn't return data. Check it was deployed with access set to Anyone.";
      case "server":
        return /key/i.test(e.message) ? "The secret key doesn't match the one in your script." : "Your script reported a problem: " + String(e.message).slice(0, 140);
      default: return "Couldn't sync with your sheet.";
    }
  }

  function parseLifts(rows) {
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i] || [];
      var date = normDate(r[0]), lift = String(r[1] || "").trim(), w = num(r[2]);
      if (!date || !lift || w == null) continue;
      out.push({ date: date, lift: lift, weight: w, reps: [num(r[3]), num(r[4]), num(r[5])], synced: true, seq: i });
    }
    return out;
  }
  function parseBody(rows) {
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i] || [];
      var date = normDate(r[0]);
      if (!date) continue;
      out.push({ date: date, weight: num(r[1]), cal: num(r[2]), feel: feelVal(r[3]), synced: true, seq: i });
    }
    return out;
  }
  function parseSteps(rows) {
    var out = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i] || [];
      var date = normDate(r[0]), n = num(r[1]);
      if (!date || n == null) continue;
      out.push({ date: date, steps: n, at: /^\d{1,2}:\d{2}$/.test(String(r[2] || "")) ? String(r[2]) : "" });
    }
    return out;
  }
  function parseSetup(rows) {
    var map = {};
    rows.forEach(function (r) { if (r && r[0]) map[r[0]] = r[1]; });
    return map;
  }
  function applySetup(map) {
    if (store.settingsDirty) return;
    var s = store.settings;
    if (map[LABELS.name]) s.name = String(map[LABELS.name]);
    if (map[LABELS.sex] === "male" || map[LABELS.sex] === "female") s.sex = map[LABELS.sex];
    if (ACTIVITY.some(function (a) { return a.id === map[LABELS.activity]; })) s.activity = map[LABELS.activity];
    ["calNeed", "calGoal", "stepGoal", "startWeight", "age", "heightCm"].forEach(function (k) {
      var v = num(map[LABELS[k]]);
      if (v != null) s[k] = v;
    });
  }

  async function flush() {
    var pend = store.lifts.filter(function (r) { return !r.synced; });
    for (var i = 0; i < pend.length; i++) {
      var r = pend[i];
      await api("append", { tab: "Lifts", row: [r.date, r.lift, r.weight, r.reps[0], r.reps[1], r.reps[2]] });
      r.synced = true; saveStore();
    }
    pend = store.body.filter(function (r) { return !r.synced; });
    for (var j = 0; j < pend.length; j++) {
      var b = pend[j];
      await api("append", { tab: "Body", row: [b.date, b.weight == null ? "" : b.weight, b.cal == null ? "" : b.cal, b.feel == null ? "" : b.feel] });
      b.synced = true; saveStore();
    }
    if (store.settingsDirty) {
      var keys = Object.keys(LABELS);
      for (var k = 0; k < keys.length; k++) {
        var v = store.settings[keys[k]];
        if (v == null || v === "") continue;
        await api("setup", { label: LABELS[keys[k]], value: v });
      }
      store.settingsDirty = false; saveStore();
    }
  }

  async function syncNow() {
    if (!store.sync.url || ui.syncing) return false;
    ui.syncing = true; ui.syncError = null; render();
    var ok = false;
    try {
      await flush();
      var d = await api("read", {});
      store.lifts = parseLifts(d.lifts || []).concat(store.lifts.filter(function (r) { return !r.synced; })).sort(byDate);
      store.body = parseBody(d.body || []).concat(store.body.filter(function (r) { return !r.synced; })).sort(byDate);
      applySetup(parseSetup(d.setup || []));
      store.steps = parseSteps(d.steps || []);
      store.lastSync = Date.now();
      ok = true;
    } catch (e) {
      ui.syncError = syncErrText(e);
    }
    ui.syncing = false; saveStore(); render();
    return ok;
  }

  /* ---------- derived data ---------- */
  function liftNames() {
    var names = store.settings.lifts.slice(), seen = {};
    names.forEach(function (n) { seen[n.toLowerCase()] = true; });
    store.lifts.forEach(function (e) {
      var k = e.lift.toLowerCase();
      if (!seen[k]) { seen[k] = true; names.push(e.lift); }
    });
    return names;
  }
  function liftInfo(name) {
    var key = name.toLowerCase(), t = todayISO();
    var all = store.lifts.filter(function (e) { return e.lift.toLowerCase() === key; });
    var before = all.filter(function (e) { return e.date < t; });
    var today = all.filter(function (e) { return e.date === t; });
    return { prev: all[all.length - 1] || null, today: today[today.length - 1] || null };
  }
  function bodyToday() {
    var t = todayISO(), o = { weight: null, cal: null, feel: null };
    store.body.forEach(function (r) {
      if (r.date !== t) return;
      if (r.weight != null) o.weight = r.weight;
      if (r.cal != null) o.cal = r.cal;
      if (r.feel != null) o.feel = r.feel;
    });
    return o;
  }
  function latestWeight() {
    for (var i = store.body.length - 1; i >= 0; i--) if (store.body[i].weight != null) return store.body[i];
    return null;
  }
  function stepsToday() {
    var t = todayISO(), hit = null;
    store.steps.forEach(function (r) { if (r.date === t) hit = r; });
    return hit;
  }
  function pending() {
    return store.lifts.filter(function (r) { return !r.synced; }).length + store.body.filter(function (r) { return !r.synced; }).length;
  }

  /* ---------- rendering ---------- */
  function statusText() {
    if (!store.sync.url) return "Saved on this phone only. Add a Google Sheet in Settings to sync.";
    if (ui.syncing) return "Syncing with your sheet…";
    if (ui.syncError) return "Not synced. " + ui.syncError + (pending() ? " " + pending() + " entries are waiting on this phone." : "");
    if (store.lastSync) return "Synced with your sheet at " + time(store.lastSync) + ".";
    return "Sheet connected. Not synced yet.";
  }

  function bar(value, goal, kind) {
    var pct = goal > 0 ? Math.min(100, Math.round((value / goal) * 100)) : 0;
    var cls = "bar";
    if (kind === "cal" && value > goal) cls += " over";
    if (kind === "steps" && value >= goal) cls += " done";
    return '<div class="' + cls + '" role="progressbar" aria-valuemin="0" aria-valuemax="' + esc(goal) + '" aria-valuenow="' + esc(value) + '"><i style="width:' + pct + '%"></i></div>';
  }

  function bodySection() {
    var bt = bodyToday(), lw = latestWeight(), s = store.settings;
    var need = s.calNeed, goal = s.calGoal, stepGoal = s.stepGoal, start = s.startWeight;

    var weight = '<div class="panel"><span class="lab">Current weight</span>';
    if (lw) {
      weight += '<div class="big">' + esc(kg(lw.weight)) + ' <small>kg</small></div>';
      weight += '<p class="sub">' + esc(stLb(lw.weight)) + ", logged " + esc(shortDate(lw.date));
      if (start != null) {
        var d = lw.weight - start;
        weight += "<br>Started at " + esc(kg(start)) + " kg, " + (d > 0 ? "up " : d < 0 ? "down " : "unchanged") + (d !== 0 ? esc(kg(Math.abs(d))) + " kg" : "");
      }
      weight += "</p>";
    } else {
      weight += '<p class="sub">No weight logged yet.</p>';
    }
    weight += "</div>";

    var cal = '<div class="panel"><span class="lab">Target calories</span>';
    if (goal != null) {
      cal += '<div class="big">' + esc(fmtInt(goal)) + ' <small>kcal a day</small></div>';
      if (need != null) {
        var gap = need - goal;
        cal += '<p class="sub">Maintenance ' + esc(fmtInt(need)) + " kcal, planned " + (gap >= 0 ? "deficit " : "surplus ") + esc(fmtInt(Math.abs(gap))) + " kcal.</p>";
      }
      if (bt.cal != null) {
        var left = goal - bt.cal;
        cal += '<p class="sub">Eaten today ' + esc(fmtInt(bt.cal)) + " kcal, " + (left >= 0 ? esc(fmtInt(left)) + " left." : esc(fmtInt(-left)) + " over.") + "</p>";
      }
    } else {
      cal += '<p class="sub">Set a daily calorie goal in Settings.</p>';
    }
    cal += "</div>";

    var stepsNow = stepsToday();
    var steps = '<div class="panel"><span class="lab">Target steps</span>';
    if (stepGoal != null && stepGoal > 0) {
      steps += '<div class="big">' + esc(fmtInt(stepGoal)) + ' <small>steps a day</small></div>';
    } else {
      steps += '<p class="sub">Set a daily step goal in Settings.</p>';
    }
    if (stepsNow) {
      var toGo = stepGoal != null && stepGoal > 0 ? stepGoal - stepsNow.steps : null;
      steps += '<p class="sub">Today ' + esc(fmtInt(stepsNow.steps)) + " steps" + (stepsNow.at ? ", as of " + esc(stepsNow.at) : "") +
        (toGo == null ? "." : toGo > 0 ? ", " + esc(fmtInt(toGo)) + " to go." : ", goal reached.") + "</p>";
    }
    steps += "</div>";

    var cur = ui.feel != null ? ui.feel : bt.feel;
    var feel = '<div class="field"><span class="lab" id="feel-lab">How I feel</span><div class="feel" role="group" aria-labelledby="feel-lab">' +
      FEEL.map(function (f, i) {
        return '<button type="button" data-act="feel" data-v="' + (i + 1) + '" aria-pressed="' + (cur === i + 1 ? "true" : "false") + '">' + esc(f) + "</button>";
      }).join("") + "</div></div>";

    var m = ui.msgs.body || {};
    var form = '<div class="panel"><div class="sec-head"><h3>Log today</h3><span>' + esc(shortDate(todayISO())) + "</span></div>" +
      '<div class="fields">' +
      '<div class="field"><label for="b-w">Weight kg</label><input id="b-w" type="number" inputmode="decimal" step="0.1" min="0" value="' + esc(bt.weight != null ? kg(bt.weight) : "") + '" placeholder="' + esc(lw ? kg(lw.weight) : "") + '"></div>' +
      '<div class="field"><label for="b-c">Calories eaten</label><input id="b-c" type="number" inputmode="numeric" step="1" min="0" value="' + esc(bt.cal != null ? bt.cal : "") + '"></div>' +
      "</div>" + feel +
      '<button data-act="save-body"' + (ui.busy.body ? " disabled" : "") + ">Save today's numbers</button>" +
      '<p class="msg ' + esc(m.kind || "") + '" role="status">' + esc(m.text || "") + "</p></div>";

    return '<section class="sec"><div class="sec-head"><h2>Daily target</h2></div><div class="tiles">' + weight + cal + steps + "</div>" + form + "</section>";
  }

  function liftCard(name) {
    var id = slug(name), info = liftInfo(name), prev = info.prev, today = info.today;
    var m = ui.msgs[id] || {};
    var h = '<article class="panel lift" data-lift="' + esc(name) + '">';
    h += '<div class="lift-head"><h3>' + esc(name) + "</h3>" + (today ? '<span class="pill">Logged today</span>' : "") + "</div>";
    if (prev) {
      h += '<div class="prev"><span class="lab">Previous session &middot; ' + esc(shortDate(prev.date)) + "</span>" +
        '<div class="prevnums"><b>' + esc(kg(prev.weight)) + ' kg</b><span>' +
        prev.reps.map(function (r) { return r == null ? "–" : esc(r); }).join(" &middot; ") + " reps</span></div></div>";
    } else {
      h += '<div class="prev"><span class="lab">Previous session</span><p class="sub">No session logged yet.</p></div>';
    }
    var defW = prev ? prev.weight : "";
    var defR = function () { return ""; };
    var phR = function (n) { return prev && prev.reps[n] != null ? prev.reps[n] : ""; };
    h += '<div class="entry">' +
      '<div class="field"><label for="w-' + id + '">Weight kg</label><input id="w-' + id + '" type="number" inputmode="decimal" step="0.5" min="0" value="' + esc(defW === "" ? "" : kg(defW)) + '"></div>';
    for (var n = 0; n < 3; n++) {
      h += '<div class="field"><label for="r' + (n + 1) + "-" + id + '">Set ' + (n + 1) + '</label><input id="r' + (n + 1) + "-" + id + '" type="number" inputmode="numeric" step="1" min="0" value="' + esc(defR(n)) + '" placeholder="' + esc(phR(n)) + '"></div>';
    }
    h += "</div>";
    h += '<div class="gain" id="gain-' + id + '"></div>';
    h += '<button data-act="save-lift" data-lift="' + esc(name) + '"' + (ui.busy[id] ? " disabled" : "") + ">Save " + esc(name) + "</button>";
    h += '<p class="msg ' + esc(m.kind || "") + '" role="status">' + esc(m.text || "") + "</p>";
    h += "</article>";
    return h;
  }

  function liftSection() {
    return '<section class="sec"><div class="sec-head"><h2>Lifts</h2><span>Aim: 3 sets of 10 to 20 reps</span></div><div class="lifts">' +
      liftNames().map(liftCard).join("") + "</div></section>";
  }


  /* ---------- progress charts ---------- */
  var CH = { W: 360, H: 220, L: 46, R: 16, T: 14, B: 30 };
  var METRICS = [
    { id: "weight", label: "Weight" },
    { id: "reps", label: "Total reps" },
    { id: "volume", label: "Volume" }
  ];
  var chartPts = [];

  function dayNum(iso) { var p = iso.split("-").map(Number); return Date.UTC(p[0], p[1] - 1, p[2]) / 86400000; }
  function dayISO(n) { return new Date(Math.round(n) * 86400000).toISOString().slice(0, 10); }
  function sumReps(reps) {
    var t = 0, any = false;
    reps.forEach(function (r) { if (r != null) { t += r; any = true; } });
    return any ? t : null;
  }
  function numText(v) { return Number(v).toLocaleString("en-GB", { maximumFractionDigits: 2 }); }
  function metricText(v, metric) {
    if (metric === "reps") return numText(v) + " reps";
    return numText(v) + " kg";
  }
  function metricUnit(metric) { return metric === "reps" ? "reps" : "kg"; }

  function bodyPoints() {
    var byDay = {}, order = [];
    store.body.forEach(function (r) {
      var o = byDay[r.date];
      if (!o) { o = byDay[r.date] = { date: r.date, weight: null, cal: null, feel: null }; order.push(r.date); }
      if (r.weight != null) o.weight = r.weight;
      if (r.cal != null) o.cal = r.cal;
      if (r.feel != null) o.feel = r.feel;
    });
    return order.sort().map(function (d) { return byDay[d]; }).filter(function (o) { return o.weight != null; }).map(function (o) {
      var bits = [stLb(o.weight)];
      if (o.cal != null) bits.push(fmtInt(o.cal) + " kcal eaten");
      if (o.feel != null) bits.push("felt " + FEEL[o.feel - 1].toLowerCase());
      return { date: o.date, v: o.weight, weight: o.weight, cal: o.cal, feel: o.feel, sub: bits.join(" · ") };
    });
  }
  function liftPoints(name, metric) {
    var key = name.toLowerCase(), byDay = {}, order = [];
    store.lifts.forEach(function (e) {
      if (e.lift.toLowerCase() !== key) return;
      if (!byDay[e.date]) order.push(e.date);
      byDay[e.date] = e;
    });
    var out = [];
    order.sort().forEach(function (d) {
      var e = byDay[d], total = sumReps(e.reps);
      var vol = total != null ? e.weight * total : null;
      var v = metric === "reps" ? total : metric === "volume" ? vol : e.weight;
      if (v == null) return;
      out.push({
        date: d, v: v, weight: e.weight, total: total, vol: vol,
        sub: kg(e.weight) + " kg · " + e.reps.map(function (r) { return r == null ? "–" : r; }).join(" · ") + " reps"
      });
    });
    return out;
  }
  function chartSeries(target, metric) {
    if (target === "body") return { body: true, metric: "weight", heading: "Body weight (kg)", pts: bodyPoints() };
    var m = METRICS.filter(function (x) { return x.id === metric; })[0] || METRICS[0];
    var unit = m.id === "reps" ? "all three sets" : m.id === "volume" ? "kg lifted: weight × total reps" : "kg";
    return { body: false, metric: m.id, heading: target + ": " + m.label.toLowerCase() + " (" + unit + ")", pts: liftPoints(target, m.id) };
  }
  function chartTarget() {
    var names = liftNames(), t = ui.chart;
    if (t !== "body" && names.indexOf(t) < 0) t = null;
    if (t == null) {
      // First time: prefer a lift with a trend, then body weight, then any lift with data.
      // Once something has data the choice is kept, so the chart doesn't jump when new entries arrive.
      var multi = names.filter(function (n) { return liftPoints(n, "weight").length >= 2; })[0];
      var any = names.filter(function (n) { return liftPoints(n, "weight").length >= 1; })[0];
      t = multi || (bodyPoints().length >= 2 ? "body" : null) || any || (bodyPoints().length ? "body" : "body");
      var has = t === "body" ? bodyPoints().length : liftPoints(t, "weight").length;
      if (has) ui.chart = t;
    }
    return t;
  }

  function niceTicks(lo, hi) {
    if (hi - lo < 1e-9) { var p = Math.max(1, Math.abs(hi) * 0.05); lo -= p; hi += p; }
    var raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
    var step = (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
    var out = [], start = Math.floor(lo / step + 1e-9) * step, end = Math.ceil(hi / step - 1e-9) * step;
    for (var v = start; v <= end + step / 1e6; v += step) out.push(parseFloat(v.toFixed(10)));
    return out;
  }

  function chartSvg(series) {
    var pts = series.pts, n = pts.length;
    var ticks = niceTicks(Math.min.apply(null, pts.map(function (p) { return p.v; })), Math.max.apply(null, pts.map(function (p) { return p.v; })));
    var t0 = ticks[0], t1 = ticks[ticks.length - 1];
    var x0 = CH.L + 10, x1 = CH.W - CH.R - 10, y0 = CH.T, y1 = CH.H - CH.B;
    var d0 = dayNum(pts[0].date), d1 = dayNum(pts[n - 1].date), span = d1 - d0;
    var yOf = function (v) { return y1 - (v - t0) / (t1 - t0) * (y1 - y0); };
    pts.forEach(function (p) {
      p.x = span === 0 ? (x0 + x1) / 2 : x0 + (dayNum(p.date) - d0) / span * (x1 - x0);
      p.y = yOf(p.v);
      p.main = metricText(p.v, series.metric);
      p.readout = "<b>" + esc(p.main) + '</b><span class="sub">' + esc(fmtDate(p.date, { weekday: "short", day: "numeric", month: "short", year: "numeric" }) + (p.sub ? " · " + p.sub : "")) + "</span>";
    });
    var g = "";
    ticks.forEach(function (t) {
      var y = yOf(t);
      g += '<line class="ch-grid" x1="' + CH.L + '" x2="' + (CH.W - CH.R) + '" y1="' + y.toFixed(1) + '" y2="' + y.toFixed(1) + '"/>' +
        '<text class="ch-tick" x="' + (CH.L - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end">' + esc(numText(t)) + "</text>";
    });
    var long = span > 330;
    var lab = function (iso) { return fmtDate(iso, long ? { month: "short", year: "2-digit" } : { day: "numeric", month: "short" }); };
    var ty = CH.H - 8, xt = function (x, anchor, iso) { return '<text class="ch-tick" x="' + x.toFixed(1) + '" y="' + ty + '" text-anchor="' + anchor + '">' + esc(lab(iso)) + "</text>"; };
    if (span === 0) g += xt((x0 + x1) / 2, "middle", pts[0].date);
    else {
      g += xt(x0, "start", pts[0].date) + xt(x1, "end", pts[n - 1].date);
      if (span >= 4) g += xt((x0 + x1) / 2, "middle", dayISO(d0 + span / 2));
    }
    if (n >= 2) g += '<path class="ch-line" d="' + pts.map(function (p, i) { return (i ? "L" : "M") + p.x.toFixed(1) + " " + p.y.toFixed(1); }).join(" ") + '"/>';
    pts.forEach(function (p, i) {
      if (n <= 40 || i === n - 1) g += '<circle class="ch-dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4"/>';
    });
    g += '<line class="ch-cx" id="ch-cx" x1="0" x2="0" y1="' + y0 + '" y2="' + y1 + '"/>' +
      '<circle class="ch-dot" id="ch-sel" cx="0" cy="0" r="6"/>' +
      '<rect x="' + CH.L + '" y="0" width="' + (CH.W - CH.L) + '" height="' + CH.H + '" fill="transparent"/>';
    var desc = series.heading + ", " + n + (n === 1 ? " entry" : " entries") + ", " + fmtDate(pts[0].date, { day: "numeric", month: "long", year: "numeric" }) +
      (n > 1 ? " to " + fmtDate(pts[n - 1].date, { day: "numeric", month: "long", year: "numeric" }) : "") + ". The same figures are in the table below.";
    return '<svg class="chart" id="ch-svg" viewBox="0 0 ' + CH.W + " " + CH.H + '" role="img" aria-label="' + esc(desc) + '">' + g + "</svg>";
  }

  function chartTable(series) {
    var head = series.body ? ["Date", "Weight kg", "Calories", "Feel"] : ["Date", "Weight kg", "Total reps", "Volume kg"];
    var rows = series.pts.slice().reverse().map(function (p) {
      var cells = series.body
        ? [kg(p.weight), p.cal != null ? fmtInt(p.cal) : "–", p.feel != null ? FEEL[p.feel - 1] : "–"]
        : [kg(p.weight), p.total != null ? numText(p.total) : "–", p.vol != null ? numText(p.vol) : "–"];
      return "<tr><td>" + esc(fmtDate(p.date, { day: "numeric", month: "short", year: "numeric" })) + "</td>" + cells.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>";
    }).join("");
    return '<details class="tblwrap" id="ch-table"' + (ui.tableOpen ? " open" : "") + "><summary>Show as table</summary>" +
      '<div class="tblscroll"><table class="tbl"><thead><tr>' + head.map(function (c) { return "<th>" + c + "</th>"; }).join("") + "</tr></thead><tbody>" + rows + "</tbody></table></div></details>";
  }

  function chartSection() {
    var target = chartTarget(), names = liftNames();
    var series = chartSeries(target, ui.metric);
    var h = '<section class="sec" id="progress"><div class="sec-head"><h2>Progress</h2><span>Every session so far</span></div><div class="panel">';
    h += '<div class="picker" role="group" aria-label="Choose what to chart">' +
      ["body"].concat(names).map(function (n) {
        return '<button type="button" id="pick-' + esc(slug(n)) + '" data-act="chart-pick" data-v="' + esc(n) + '" aria-pressed="' + (n === target ? "true" : "false") + '">' + (n === "body" ? "Body weight" : esc(n)) + "</button>";
      }).join("") + "</div>";
    if (target !== "body") {
      h += '<div class="picker" role="group" aria-label="Choose the measure">' + METRICS.map(function (m) {
        return '<button type="button" id="met-' + m.id + '" data-act="chart-metric" data-v="' + m.id + '" aria-pressed="' + (m.id === series.metric ? "true" : "false") + '">' + m.label + "</button>";
      }).join("") + "</div>";
    }
    h += '<p class="lab">' + esc(series.heading) + "</p>";
    chartPts = series.pts;
    if (!series.pts.length) {
      chartPts = [];
      return h + '<p class="sub">Nothing to chart yet. Log ' + (series.body ? "your weight" : "a session") + " and it will appear here.</p></div></section>";
    }
    var n = series.pts.length, first = series.pts[0], last = series.pts[n - 1];
    h += '<div class="readout"><button type="button" class="step" id="ch-prev" data-act="chart-step" data-v="-1" aria-label="Previous entry">‹</button>' +
      '<div class="rv" id="ch-read" aria-live="polite"></div>' +
      '<button type="button" class="step" id="ch-next" data-act="chart-step" data-v="1" aria-label="Next entry">›</button></div>';
    h += '<div class="chartbox">' + chartSvg(series) + "</div>";
    var unit = metricUnit(series.metric), delta = last.v - first.v;
    var neutral = function (label, v) {
      return '<span class="chip same"><small>' + label + "</small> " + (v > 0 ? "+" : v < 0 ? "−" : "±") + numText(Math.abs(v)) + " " + unit + "</span>";
    };
    h += '<div class="gain">';
    if (n > 1) h += '<span class="chip same"><small>First</small> ' + esc(metricText(first.v, series.metric)) + "</span>";
    h += '<span class="chip same"><small>Latest</small> ' + esc(metricText(last.v, series.metric)) + "</span>";
    if (n > 1) h += series.body ? neutral("Change", delta) : chip("Change", delta, unit);
    if (series.body && store.settings.startWeight != null) h += neutral("Since start", last.v - store.settings.startWeight);
    if (n === 1) h += '<span class="sub">The line appears after a second entry.</span>';
    h += "</div>" + chartTable(series) + "</div></section>";
    return h;
  }

  function setSel(i) {
    if (!chartPts.length) return;
    i = Math.max(0, Math.min(chartPts.length - 1, i));
    ui.sel = i === chartPts.length - 1 ? null : i; // null follows the latest entry as new ones arrive
    var p = chartPts[i], el;
    if ((el = document.getElementById("ch-read"))) el.innerHTML = p.readout;
    if ((el = document.getElementById("ch-cx"))) { el.setAttribute("x1", p.x.toFixed(1)); el.setAttribute("x2", p.x.toFixed(1)); }
    if ((el = document.getElementById("ch-sel"))) { el.setAttribute("cx", p.x.toFixed(1)); el.setAttribute("cy", p.y.toFixed(1)); }
    if ((el = document.getElementById("ch-prev"))) el.setAttribute("aria-disabled", i === 0 ? "true" : "false");
    if ((el = document.getElementById("ch-next"))) el.setAttribute("aria-disabled", i === chartPts.length - 1 ? "true" : "false");
  }
  function chartPointer(e) {
    var svg = e.target && e.target.closest ? e.target.closest("#ch-svg") : null;
    if (!svg || !chartPts.length) return;
    var r = svg.getBoundingClientRect();
    if (!r.width) return;
    var x = (e.clientX - r.left) * (CH.W / r.width), best = 0, bd = Infinity;
    chartPts.forEach(function (p, i) { var d = Math.abs(p.x - x); if (d < bd) { bd = d; best = i; } });
    setSel(best);
  }

  function settingsSection() {
    var s = store.settings, sm = ui.msgs.settings || {}, ym = ui.msgs.sync || {};
    var val = function (v) { return esc(v == null ? "" : v); };
    var sexOpts = [["", "Choose"], ["female", "Female"], ["male", "Male"]].map(function (o) {
      return '<option value="' + o[0] + '"' + (s.sex === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
    }).join("");
    var actOpts = '<option value="">Choose</option>' + ACTIVITY.map(function (a) {
      return '<option value="' + a.id + '"' + (s.activity === a.id ? " selected" : "") + ">" + esc(a.label) + "</option>";
    }).join("");
    return '<details class="panel" id="settings"' + (ui.settingsOpen ? " open" : "") + "><summary>Settings</summary>" +
      '<div class="fields">' +
      '<div class="field"><label for="s-name">Name</label><input class="text" id="s-name" type="text" autocomplete="off" value="' + val(s.name) + '"></div>' +
      '<div class="field"><label for="s-start">Starting weight kg</label><input id="s-start" type="number" inputmode="decimal" step="0.1" min="0" value="' + val(s.startWeight) + '"></div>' +
      '<div class="field"><label for="s-need">Calories needed a day</label><input id="s-need" type="number" inputmode="numeric" min="0" value="' + val(s.calNeed) + '"></div>' +
      '<div class="field"><label for="s-goal">Calorie goal a day</label><input id="s-goal" type="number" inputmode="numeric" min="0" value="' + val(s.calGoal) + '"></div>' +
      '<div class="field"><label for="s-steps">Step goal a day</label><input id="s-steps" type="number" inputmode="numeric" min="0" value="' + val(s.stepGoal) + '"></div>' +
      "</div>" +
      '<div class="group"><h3>Work out calories needed</h3>' +
      '<p class="sub">Estimates the calories burned in a day with the Mifflin-St Jeor formula, using the current weight. Fill in the details, then use the result as the calories needed.</p>' +
      '<div class="fields">' +
      '<div class="field"><label for="s-sex">Sex used in the formula</label><select id="s-sex">' + sexOpts + "</select></div>" +
      '<div class="field"><label for="s-age">Age</label><input id="s-age" type="number" inputmode="numeric" min="10" max="100" value="' + val(s.age) + '"></div>' +
      '<div class="field"><label for="s-height">Height cm</label><input id="s-height" type="number" inputmode="decimal" min="100" max="250" value="' + val(s.heightCm) + '"></div>' +
      "</div>" +
      '<div class="field"><label for="s-activity">Activity level</label><select id="s-activity">' + actOpts + "</select></div>" +
      '<div class="calc" id="calc" aria-live="polite"></div>' +
      '<button type="button" class="quiet" data-act="use-calc">Use as calories needed</button>' +
      '<p class="msg" id="calc-note" role="status"></p></div>' +
      '<div class="group"><div class="field"><label for="s-lifts">Lifts, one per line</label><textarea id="s-lifts" spellcheck="false">' + esc(s.lifts.join("\n")) + "</textarea></div></div>" +
      '<button data-act="save-settings">Save settings</button>' +
      '<p class="msg ' + esc(sm.kind || "") + '" role="status">' + esc(sm.text || "") + "</p>" +
      '<div class="group"><h3>Google Sheet sync</h3>' +
      '<p class="sub">Optional. Paste the web app URL and secret key from your Apps Script. Without them, everything is saved on this phone only.</p>' +
      '<div class="field"><label for="sync-url">Web app URL</label><input class="text" id="sync-url" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + val(store.sync.url) + '" placeholder="https://script.google.com/macros/s/…/exec"></div>' +
      '<div class="field"><label for="sync-key">Secret key</label><div class="keyrow"><input class="text" id="sync-key" type="' + (ui.showKey ? "text" : "password") + '" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + val(store.sync.key) + '">' +
      '<button type="button" class="quiet" id="toggle-key" data-act="toggle-key" aria-controls="sync-key" aria-pressed="' + (ui.showKey ? "true" : "false") + '" aria-label="' + (ui.showKey ? "Hide secret key" : "Show secret key") + '">' + (ui.showKey ? "Hide" : "Show") + "</button></div></div>" +
      '<button class="quiet" data-act="save-sync"' + (ui.syncing ? " disabled" : "") + ">Save and sync</button>" +
      '<p class="msg ' + esc(ym.kind || "") + '" role="status">' + esc(ym.text || "") + "</p></div>" +
      "</details>";
  }

  function html() {
    var t = todayISO();
    var name = store.settings.name;
    var h = '<header><p class="eyebrow">' + esc(longDate(t)) + "</p><h1>" + (name ? esc(name) + "'s lift log" : "Lift log") + "</h1></header>";
    h += '<p class="status" role="status">' + esc(statusText()) + "</p>";
    if (ui.storageWarn) h += '<div class="banner" role="alert">This browser isn\'t saving data on your phone. Turn off private browsing, or entries will be lost when you close the page.</div>';
    if (store.settings.calGoal == null && !store.sync.url) h += '<div class="banner">Set your goals, and optionally connect a Google Sheet, in Settings at the bottom of the page.</div>';
    h += bodySection() + liftSection() + chartSection() + settingsSection();
    h += '<p class="foot">The date is added automatically from today\'s date on this phone.</p>';
    return h;
  }

  function render() {
    var snap = {};
    document.querySelectorAll("#app input, #app textarea, #app select").forEach(function (i) {
      if (i.id && ui.touched[i.id]) snap[i.id] = i.value;
    });
    var ae = document.activeElement;
    var focusId = ae && ae.id && ae.closest && ae.closest("#app") ? ae.id : null;
    $("#app").innerHTML = html();
    Object.keys(snap).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.value = snap[id];
    });
    if (focusId) {
      var f = document.getElementById(focusId);
      if (f && f.focus) f.focus();
    }
    ui.renderedDate = todayISO();
    liftNames().forEach(updateGain);
    updateCalc();
    setSel(ui.sel == null ? chartPts.length - 1 : ui.sel);
  }

  /* ---------- live change vs previous session ---------- */
  function chip(label, v, unit) {
    var cls = v > 0 ? "up" : v < 0 ? "down" : "same";
    var sign = v > 0 ? "+" : v < 0 ? "−" : "±";
    var val = Math.abs(parseFloat(v.toFixed(2))).toLocaleString("en-GB");
    return '<span class="chip ' + cls + '"><small>' + label + "</small> " + sign + val + " " + unit + "</span>";
  }
  function updateGain(name) {
    var id = slug(name), box = document.getElementById("gain-" + id);
    if (!box) return;
    var prev = liftInfo(name).prev;
    var w = num((document.getElementById("w-" + id) || {}).value);
    var reps = [1, 2, 3].map(function (n) { return num((document.getElementById("r" + n + "-" + id) || {}).value); });
    var ready = w != null && reps.every(function (r) { return r != null; });
    var out = "";
    if (!ready) {
      out = "Enter the weight and all three sets to see your change.";
    } else if (!prev || prev.reps.some(function (r) { return r == null; })) {
      out = "First logged session for this lift, so there is nothing to compare yet.";
    } else {
      var sum = reps[0] + reps[1] + reps[2];
      var pSum = prev.reps[0] + prev.reps[1] + prev.reps[2];
      out = chip("Weight", w - prev.weight, "kg") + chip("Reps", sum - pSum, "reps") + chip("Volume", w * sum - prev.weight * pSum, "kg");
    }
    if (ready && reps.every(function (r) { return r >= 20; })) {
      out += '<div class="hint">Every set reached 20 reps. Try a heavier weight next time.</div>';
    }
    box.innerHTML = out;
  }

  /* ---------- saving ---------- */
  function setMsg(key, text, kind) { ui.msgs[key] = { text: text, kind: kind || "" }; }
  function clearTouched(prefixes) {
    Object.keys(ui.touched).forEach(function (k) {
      if (prefixes.some(function (p) { return k.indexOf(p) === 0; })) delete ui.touched[k];
    });
  }
  function afterLocalSave(key, extra) {
    var tail = extra ? " " + extra : "";
    if (!store.sync.url) { setMsg(key, "Saved on this phone." + tail, "ok"); render(); return; }
    setMsg(key, "Saved on this phone. Syncing…" + tail, "ok"); render();
    syncNow().then(function (ok) {
      setMsg(key, (ok ? "Saved and synced to your sheet." : "Saved on this phone. It will sync when your sheet is reachable.") + tail, ok ? "ok" : "err");
      render();
    });
  }

  function saveLift(name) {
    var id = slug(name);
    var w = num(document.getElementById("w-" + id).value);
    var reps = [1, 2, 3].map(function (n) { return num(document.getElementById("r" + n + "-" + id).value); });
    if (w == null || w <= 0 || reps.some(function (r) { return r == null || r < 1 || !Number.isInteger(r); })) {
      setMsg(id, "Enter the weight and whole-number reps for all three sets.", "err"); render(); return;
    }
    var before = liftInfo(name).prev;
    store.lifts.push({ date: todayISO(), lift: name, weight: w, reps: reps, synced: false, seq: 1000000 + store.uid++ });
    store.lifts.sort(byDate);
    saveStore();
    clearTouched(["w-" + id, "r1-" + id, "r2-" + id, "r3-" + id]);
    afterLocalSave(id, gainText(before, w, reps));
  }

  function saveBody() {
    var w = num(document.getElementById("b-w").value);
    var c = num(document.getElementById("b-c").value);
    var f = ui.feel;
    if (w == null && c == null && f == null) { setMsg("body", "Enter your weight, calories or how you feel.", "err"); render(); return; }
    if ((w != null && w <= 0) || (c != null && c < 0)) { setMsg("body", "Use positive numbers.", "err"); render(); return; }
    store.body.push({ date: todayISO(), weight: w, cal: c, feel: f, synced: false, seq: 1000000 + store.uid++ });
    store.body.sort(byDate);
    saveStore();
    clearTouched(["b-w", "b-c"]);
    ui.feel = null;
    afterLocalSave("body");
  }

  function saveSettings() {
    var s = store.settings;
    var v = function (id) { return document.getElementById(id).value; };
    var checks = { "s-start": "Starting weight", "s-need": "Calories needed", "s-goal": "Calorie goal", "s-steps": "Step goal", "s-age": "Age", "s-height": "Height" };
    for (var id in checks) {
      var raw = v(id).trim();
      if (raw !== "" && (num(raw) == null || num(raw) < 0)) { setMsg("settings", checks[id] + " must be a positive number.", "err"); render(); return; }
    }
    var ageV = num(v("s-age")), heightV = num(v("s-height"));
    if (ageV != null && (!Number.isInteger(ageV) || ageV < 10 || ageV > 100)) { setMsg("settings", "Enter age as a whole number from 10 to 100.", "err"); render(); return; }
    if (heightV != null && (heightV < 100 || heightV > 250)) { setMsg("settings", "Enter height in centimetres, between 100 and 250.", "err"); render(); return; }
    s.name = v("s-name").trim().slice(0, 40);
    s.startWeight = num(v("s-start")); s.calNeed = num(v("s-need")); s.calGoal = num(v("s-goal")); s.stepGoal = num(v("s-steps"));
    s.sex = v("s-sex"); s.age = ageV; s.heightCm = heightV; s.activity = v("s-activity");
    var seen = {}, lifts = [];
    v("s-lifts").split(/\r?\n/).forEach(function (l) {
      l = l.trim().slice(0, 30);
      if (l && !seen[l.toLowerCase()]) { seen[l.toLowerCase()] = true; lifts.push(l); }
    });
    s.lifts = lifts.length ? lifts : DEFAULT_LIFTS.slice();
    store.settingsDirty = true;
    saveStore();
    clearTouched(["s-name", "s-start", "s-need", "s-goal", "s-steps", "s-lifts", "s-sex", "s-age", "s-height", "s-activity"]);
    setMsg("settings", store.sync.url ? "Saved. Syncing…" : "Saved on this phone.", "ok");
    render();
    if (store.sync.url) syncNow().then(function (ok) { setMsg("settings", ok ? "Saved and synced to your sheet." : "Saved on this phone. It will sync when your sheet is reachable.", ok ? "ok" : "err"); render(); });
  }

  function saveSync() {
    var url = document.getElementById("sync-url").value.trim();
    var key = document.getElementById("sync-key").value.trim();
    if (url && !/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(url)) {
      setMsg("sync", "That doesn't look like a web app URL. It should start with https://script.google.com/macros/s/ and end with /exec.", "err"); render(); return;
    }
    if (url && !key) { setMsg("sync", "Enter the secret key from your script.", "err"); render(); return; }
    store.sync = { url: url, key: key };
    store.lastSync = null;
    saveStore();
    clearTouched(["sync-url", "sync-key"]);
    if (!url) { setMsg("sync", "Sync turned off. Entries stay on this phone.", "ok"); render(); return; }
    setMsg("sync", "Connecting…", ""); render();
    syncNow().then(function (ok) {
      setMsg("sync", ok ? "Connected. Your sheet and this phone are in sync." : ui.syncError, ok ? "ok" : "err");
      render();
    });
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!b || b.disabled) return;
    var a = b.getAttribute("data-act");
    if (a === "save-lift") saveLift(b.getAttribute("data-lift"));
    else if (a === "save-body") saveBody();
    else if (a === "save-settings") saveSettings();
    else if (a === "save-sync") saveSync();
    else if (a === "use-calc") useCalc();
    else if (a === "toggle-key") { ui.showKey = !ui.showKey; render(); }
    else if (a === "feel") { ui.feel = Number(b.getAttribute("data-v")); render(); }
    else if (a === "chart-pick") { ui.chart = b.getAttribute("data-v"); ui.sel = null; render(); }
    else if (a === "chart-metric") { ui.metric = b.getAttribute("data-v"); ui.sel = null; render(); }
    else if (a === "chart-step") setSel((ui.sel == null ? chartPts.length - 1 : ui.sel) + Number(b.getAttribute("data-v")));
  });
  document.addEventListener("pointerdown", chartPointer);
  document.addEventListener("pointermove", chartPointer);
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t && t.id) ui.touched[t.id] = true;
    var card = t && t.closest ? t.closest(".lift") : null;
    if (card) updateGain(card.getAttribute("data-lift"));
    if (t && t.closest && t.closest("#settings")) updateCalc();
  });
  document.addEventListener("toggle", function (e) {
    if (e.target && e.target.id === "settings") ui.settingsOpen = e.target.open;
    if (e.target && e.target.id === "ch-table") ui.tableOpen = e.target.open;
  }, true);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (ui.renderedDate !== todayISO()) render();
    if (store.sync.url && (!store.lastSync || Date.now() - store.lastSync > 60000)) syncNow();
  });

  /* ---------- start ---------- */
  loadStore();
  render();
  if (store.sync.url) syncNow();
})();
</script>
</body>
</html>
