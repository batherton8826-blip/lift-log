<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1413" media="(prefers-color-scheme: dark)">
<title>Gym</title>
<link rel="apple-touch-icon" href="data:image/png;base64,__ICON__">
<link rel="icon" href="data:image/png;base64,__ICON__">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* One phone-width column. Four tabs: Workout, Progress, Me, Plan. */
  :root {
    --bg: #eef1f0; --surface: #ffffff; --surface-2: #f4f7f6; --ink: #121a19; --muted: #56625f; --line: #d3dbd8;
    --accent: #0f766e; --accent-ink: #ffffff; --accent-soft: #d9f1ee;
    --up: #116b34; --up-bg: #e1f3e6; --down: #b0281c; --down-bg: #fbe5e2; --same: #4a545b; --same-bg: #e7eae8;
    --warn-bg: #fff3d6; --warn-ink: #6b4a00;
    --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
    --body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1413; --surface: #161e1d; --surface-2: #1d2726; --ink: #e9f0ee; --muted: #9aa9a5; --line: #2a3634;
      --accent: #5fd4c4; --accent-ink: #062320; --accent-soft: #143430;
      --up: #5fe08d; --up-bg: #15301f; --down: #ff9a8b; --down-bg: #3a1c19; --same: #b4bec4; --same-bg: #262f34;
      --warn-bg: #3a2f10; --warn-ink: #f3d58a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1413; --surface: #161e1d; --surface-2: #1d2726; --ink: #e9f0ee; --muted: #9aa9a5; --line: #2a3634;
    --accent: #5fd4c4; --accent-ink: #062320; --accent-soft: #143430;
    --up: #5fe08d; --up-bg: #15301f; --down: #ff9a8b; --down-bg: #3a1c19; --same: #b4bec4; --same-bg: #262f34;
    --warn-bg: #3a2f10; --warn-ink: #f3d58a;
    color-scheme: dark;
  }

  /* Colour themes (Customise). Teal is the default above. */
  :root[data-accent="berry"] { --accent: #be185d; --accent-ink: #ffffff; --accent-soft: #fce7f3; }
  :root[data-accent="purple"] { --accent: #6d28d9; --accent-ink: #ffffff; --accent-soft: #ede9fe; }
  :root[data-accent="blue"] { --accent: #1d4ed8; --accent-ink: #ffffff; --accent-soft: #dbeafe; }
  :root[data-accent="coral"] { --accent: #c2410c; --accent-ink: #ffffff; --accent-soft: #ffedd5; }
  @media (prefers-color-scheme: dark) {
    :root[data-accent="berry"]:not([data-theme="light"]) { --accent: #f472b6; --accent-ink: #2a0718; --accent-soft: #3a1529; }
    :root[data-accent="purple"]:not([data-theme="light"]) { --accent: #b39dfa; --accent-ink: #1a1033; --accent-soft: #261c45; }
    :root[data-accent="blue"]:not([data-theme="light"]) { --accent: #7aa2ff; --accent-ink: #0b1220; --accent-soft: #172554; }
    :root[data-accent="coral"]:not([data-theme="light"]) { --accent: #fb923c; --accent-ink: #2a1206; --accent-soft: #3b1d0c; }
  }
  :root[data-accent="berry"][data-theme="dark"] { --accent: #f472b6; --accent-ink: #2a0718; --accent-soft: #3a1529; }
  :root[data-accent="purple"][data-theme="dark"] { --accent: #b39dfa; --accent-ink: #1a1033; --accent-soft: #261c45; }
  :root[data-accent="blue"][data-theme="dark"] { --accent: #7aa2ff; --accent-ink: #0b1220; --accent-soft: #172554; }
  :root[data-accent="coral"][data-theme="dark"] { --accent: #fb923c; --accent-ink: #2a1206; --accent-soft: #3b1d0c; }
  .swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
  .swatches button { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; background: var(--surface-2); color: var(--ink); border: 2px solid var(--line); font: 600 0.9375rem var(--body); }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .swatches i { width: 22px; height: 22px; border-radius: 999px; flex: 0 0 auto; }
  .headrow { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .aa { position: relative; flex: 0 0 auto; min-width: 48px; min-height: 48px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
  .aa .aa-lv { position: absolute; right: 4px; bottom: 2px; font: 700 0.6875rem/1 var(--body); color: var(--muted); }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 1rem/1.45 var(--body);
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-bottom: max(96px, calc(env(safe-area-inset-bottom, 0px) + 80px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  h1, h2, h3, p { margin: 0; }
  .eyebrow { color: var(--muted); font-size: 0.875rem; letter-spacing: 0.04em; text-transform: uppercase; }
  h1 { font: 700 2.25rem/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
  h2 { font: 700 1.5rem/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
  h3 { font: 700 1.375rem/1.05 var(--display); text-transform: uppercase; letter-spacing: 0.03em; }
  .status { color: var(--muted); font-size: 0.875rem; margin-top: -6px; }
  .banner { background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .banner button { min-height: 36px; padding: 0 12px; background: transparent; color: inherit; border: 1px solid currentColor; }
  .sec { display: flex; flex-direction: column; gap: 12px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .sec-head span { color: var(--muted); font-size: 0.875rem; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .lab { color: var(--muted); font-size: 0.8125rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .sub { color: var(--muted); font-size: 0.875rem; }
  .num { font: 700 2rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .num small { font: 600 1rem/1 var(--body); color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }

  /* tabs */
  .tabs { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; margin: 0 -4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .tabs button { min-height: 44px; padding: 0 4px; background: transparent; color: var(--ink); border: 0; font: 600 0.9375rem var(--body); }
  .tabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

  /* controls */
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { color: var(--muted); font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }
  input, select, textarea {
    width: 100%; min-width: 0; padding: 0 10px; background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; font: 600 1.25rem var(--display); font-variant-numeric: tabular-nums;
  }
  input, select { height: 48px; }
  input.text, select, textarea { font: 500 1rem var(--body); }
  textarea { padding: 10px; min-height: 90px; resize: vertical; line-height: 1.4; }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: 0.75; font-weight: 500; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { min-height: 48px; padding: 0 18px; border-radius: 8px; border: 0; cursor: pointer; background: var(--accent); color: var(--accent-ink); font: 600 1rem var(--body); }
  button.quiet { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
  button.small { min-height: 40px; padding: 0 12px; font-size: 0.9375rem; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { background: var(--surface); color: var(--ink); border: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center; line-height: 1.15; padding: 6px 10px; }
  .seg button small { font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.85; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .msg { font-size: 0.9375rem; min-height: 1.2em; }
  .msg.ok { color: var(--up); }
  .msg.err { color: var(--down); }
  .msg.well { background: var(--up-bg); color: var(--up); border-radius: 8px; padding: 10px 12px; font-weight: 600; }

  /* exercise card */
  .ex-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .ex-head h3 { flex: 1 1 auto; min-width: 0; }
  .ex-head .swapbtn { flex: 0 0 auto; }
  .swapped { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--warn-bg); color: var(--warn-ink); border-radius: 8px; padding: 8px 10px; font-size: 0.9375rem; }
  .swapped button { flex: 0 0 auto; }
  .info { flex: 0 0 auto; width: 44px; min-height: 44px; padding: 0; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font: 700 1.25rem/1 Georgia, "Times New Roman", serif; font-style: italic; }
  .pill { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; background: var(--up-bg); color: var(--up); white-space: nowrap; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 0.8125rem; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
  .tag.note { color: var(--ink); font-weight: 600; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .box { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .box.goal { background: var(--accent-soft); }
  .box b { font: 700 1.375rem/1.05 var(--display); font-variant-numeric: tabular-nums; }
  .box span.v { font: 600 1.0625rem var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
  .box.goal span.v { color: var(--ink); }
  .entry { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; gap: 8px; align-items: end; }
  .entry.three { grid-template-columns: 1fr 1fr 1fr; }
  .entry.one { grid-template-columns: minmax(0, 200px); }
  .card-done { opacity: 0.92; }

  /* suggestion + celebration */
  .suggest { border: 2px solid var(--accent); }
  .suggest ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; }
  .done-banner { background: var(--up-bg); color: var(--up); border-radius: 10px; padding: 14px; font-weight: 600; }
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,0.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom, 0px)); }
  .sheet { position: relative; overflow: hidden; width: 100%; max-width: 560px; max-height: 85vh; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .sheet ol, .sheet ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
  .sheet .sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .cel { background: var(--accent); color: var(--accent-ink); text-align: left; }
  .cel > * { position: relative; z-index: 1; }
  .cel .cel-head { font: 700 2.25rem/1.05 var(--display); text-transform: uppercase; }
  .cel button { background: var(--accent-ink); color: var(--accent); align-self: flex-start; }
  .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .confetti i { position: absolute; top: -16px; width: 8px; height: 14px; border-radius: 2px; animation: fall 3s ease-in 2 both; }
  @keyframes fall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(320px) rotate(560deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } }

  /* rest timer */
  .restbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
  .restbar .inner { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
  .restbar .rlabel { flex: 1 1 auto; font: 700 1.25rem/1 var(--display); text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .restbar button { min-height: 44px; padding: 0 12px; white-space: nowrap; }
  .restbar .rlabel { min-width: 0; font-size: 1.125rem; }

  /* plan */
  .plist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .pitem { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .pitem .ptop { display: flex; gap: 8px; align-items: center; }
  .pitem .pname { flex: 1 1 auto; min-width: 0; font-weight: 600; }
  .pitem .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .pitem .tools button { min-height: 40px; padding: 0 12px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; min-height: 40px; padding: 0 12px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font: 600 0.9375rem var(--body); }
  .chips button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cat { display: flex; flex-direction: column; gap: 6px; }
  .catrow { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .catrow .cname { flex: 1 1 auto; min-width: 0; }
  .catrow .cname b { display: block; font-weight: 600; }
  .catrow .info { width: 40px; min-height: 40px; }
  .group { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .calc { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
  .calc b { font: 700 1.625rem/1 var(--display); font-variant-numeric: tabular-nums; display: block; }
  .keyrow { display: flex; gap: 8px; }
  .keyrow input { flex: 1 1 auto; }
  .keyrow button { flex: 0 0 auto; min-width: 84px; }

  /* charts */
  .readout { display: flex; align-items: center; gap: 10px; min-height: 84px; }
  .readout .rv { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .readout .rv b { font: 700 1.75rem/1 var(--display); font-variant-numeric: tabular-nums; }
  .readout .step { flex: 0 0 auto; min-width: 44px; min-height: 44px; padding: 0; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); font-size: 1.25rem; }
  .readout .step[aria-disabled="true"] { opacity: 0.4; }
  .chart { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .ch-grid { stroke: var(--line); stroke-width: 1; }
  .ch-tick { fill: var(--muted); font: 500 12px var(--body); }
  .ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .ch-dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .ch-cx { stroke: var(--muted); stroke-width: 1; }
  .chip { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 9px; border-radius: 999px; font: 600 0.9375rem var(--body); font-variant-numeric: tabular-nums; }
  .chip small { font-size: 0.6875rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.85; }
  .chip.up { background: var(--up-bg); color: var(--up); }
  .chip.down { background: var(--down-bg); color: var(--down); }
  .chip.same { background: var(--same-bg); color: var(--same); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
  table.tbl th, table.tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.tbl th { color: var(--muted); font-weight: 600; font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase; }
  .tblscroll { max-height: 280px; overflow: auto; }
  details summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font: 600 0.9375rem var(--body); color: var(--muted); }
  .foot { color: var(--muted); font-size: 0.8125rem; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
(function () {
  "use strict";

  var STORE_KEY = "gym-v1";
  var KG_PER_LB = 0.45359237;
  var SESSIONS = [["1", "Exercises"]];
  var PLAN_KEYS = ["W", "WX", "1"]; // W: warm-up every session, WX: warm-up, choose one
  function isWarm(k) { return k === "W" || k === "WX"; }
  var AREAS = ["Legs", "Back", "Chest", "Shoulders", "Arms", "Core", "Cardio"];
  var EQUIP = ["Machine", "Cable", "Dumbbell", "Kettlebell", "Bodyweight", "Cardio machine"];
  var PER = [["", "Total"], ["each hand", "Each hand"], ["each arm", "Each arm"], ["each side", "Each side"]];
  var ACTIVITY = [
    { id: "sedentary", f: 1.2, label: "Little or no exercise" },
    { id: "light", f: 1.375, label: "Light: exercise 1–3 days a week" },

    { id: "very", f: 1.725, label: "Very active: 6–7 days a week" }
  ];
  var GOALS = [
    { id: "0", d: 0, label: "Stay the same weight" },
    { id: "250", d: 250, label: "Lose slowly (about 0.25 kg a week)" },
    { id: "500", d: 500, label: "Lose steadily (about 0.5 kg a week)" }
  ];
  var LABELS = { name: "Name", sex: "Sex", age: "Age", heightCm: "Height (cm)", activity: "Activity", goal: "Goal (kcal under maintenance)", low: "Rep range low", high: "Rep range high", planStart: "Plan started", dismissUntil: "Next plan dismissed until" };

  /* ---------- exercise catalogue ----------
     t: "reps" or "time". p: what the weight/reps are per. inc: weight step in kg. nw: no weight. next: suggested swap. */
  var CATALOGUE = [
    { id: "rope-pull", n: "Rope pull", a: "Cardio", e: "Cardio machine", t: "time", nw: true, next: "rowing-machine",
      how: ["Stand facing the rope machine with your feet hip-width apart and knees soft.", "Hold the rope with one hand above the other and pull it down hand over hand in a steady rhythm.", "Keep your chest up and your stomach braced for the whole time."],
      tips: ["Breathe steadily; don't hold your breath.", "Keep a pace you can hold for the full time, then push in the last 10 seconds."] },
    { id: "incline-walk", n: "Incline walk", a: "Cardio", e: "Cardio machine", t: "mins", nw: true,
      how: ["Start the treadmill at a comfortable walking pace, holding the handrails lightly to begin.", "Raise the incline gradually until you're working hard but can still talk.", "Walk tall with a natural arm swing. For the last minute, lower the incline and speed to cool down."],
      tips: ["Once you're steady, try not to lean on the handrails.", "Put your incline and speed in the settings note (Plan, Edit) so you can match or beat it next time."] },
    { id: "exercise-bike", n: "Exercise bike", a: "Cardio", e: "Cardio machine", t: "mins", nw: true,
      how: ["Set the seat so your leg is almost straight when the pedal is at the bottom.", "Pedal at an easy level for a couple of minutes to start.", "Raise the level until you're working but can still talk, then ease off for the last minute."],
      tips: ["Sit tall with relaxed shoulders.", "If your knees ache, check the seat height."] },
    { id: "cross-trainer", n: "Cross-trainer", a: "Cardio", e: "Cardio machine", t: "mins", nw: true,

      else out.text = "Saved. Same as last time; aim for one more next time.";
      var maxW = Math.max.apply(null, all.map(function (r) { return r.weight || 0; }));
      var maxT = Math.max.apply(null, all.map(function (r) { return sum(r.sets) || 0; }));
      if (!ex.noW && (rec.weight || 0) > maxW) out.pb = { title: "New personal best!", text: "Heaviest " + ex.name + " yet: " + nt(rec.weight) + " " + weightLabel(ex) + "." };
      else if ((ex.noW || ex.type !== "reps") && tot > maxT) out.pb = { title: "New personal best!", text: "Your best " + ex.name + " yet: " + nt(tot) + " " + unit + " in total." };
    }
    if (rec.type === "reps" && !ex.noW && rec.sets.every(function (r) { return r != null && r >= H; })) {
      out.text += " You did " + H + " on every set, so next time the target goes up to " + nt((rec.weight || 0) + (ex.inc || 0)) + " kg.";
    }
    return out;
  }
  // Saves one exercise from its card. Returns "saved", "empty" or "error"; the card's message is set either way.
  function saveCore(s, id, sess, batch) {
    var ex = activeList(s).filter(function (e) { return e.id === id; })[0];
    if (!ex) return "error";
    var k = exKey(s, ex);
    var w = ex.noW ? 0 : num((document.getElementById("w-" + k) || {}).value);
    var sets = [1, 2, 3].map(function (n) { return num((document.getElementById("s" + n + "-" + k) || {}).value); });
    if (!sets.some(function (v) { return v != null; })) {
      if (batch) return "empty";
      setMsg(k, ex.type === "mins" ? "Enter how many minutes you did." : "Enter the " + (ex.type === "time" ? "seconds" : "reps") + " for at least one set.", "err"); return "error";
    }
    if (!ex.noW && (w == null || w < 0)) { setMsg(k, "Enter the weight you used (0 if none).", "err"); return "error"; }
    if (sets.some(function (v) { return v != null && (v <= 0 || (ex.type === "reps" && !Number.isInteger(v))); })) { setMsg(k, ex.type === "time" ? "Use whole seconds above 0." : ex.type === "mins" ? "Use minutes above 0." : "Reps must be whole numbers above 0.", "err"); return "error"; }
    var all = logsFor(ex.id), prev = all[all.length - 1] || null;
    var warm = isWarm(s);
    var rec = { date: todayISO(), session: warm ? (sess || nextSession()) : s, exId: ex.id, name: ex.name, type: ex.type, weight: ex.noW ? null : w, sets: sets, synced: false, seq: 1000000 + store.uid++ };
    var wd = warm ? { kind: "ok", text: "Warm-up done. On to the main session!", pb: null } : wellDone(prev, all, rec, ex);
    store.logs.push(rec); store.logs.sort(byDate);
    if (!store.settings.planStart) { store.settings.planStart = todayISO(); store.settingsDirty = true; }
    saveStore();
    clearTouched(["w-" + k, "s1-" + k, "s2-" + k, "s3-" + k]);
    setMsg(k, wd.text, wd.kind);
    if (wd.pb && !ui.pb) ui.pb = wd.pb;
    ui.session = rec.session;
    ui.lastSavedKey = k;
    return "saved";
  }
  function saveEx(s, id, sess) {
    var r = saveCore(s, id, sess, false);
    if (r !== "saved") { render(); return; }
    var m = ui.msgs[ui.lastSavedKey] || {};
    afterLocalSave(ui.lastSavedKey, m.text);
  }
  function saveAll() {
    var btns = Array.prototype.slice.call(document.querySelectorAll('#app [data-act="save-ex"]'));
    var saved = 0, empty = 0, errors = 0, wins = 0;
    btns.forEach(function (b) {
      var r = saveCore(b.getAttribute("data-s"), b.getAttribute("data-v"), b.getAttribute("data-sess"), true);
      if (r === "saved") { saved++; if (/^Well done/.test((ui.msgs[ui.lastSavedKey] || {}).text || "")) wins++; }
      else if (r === "empty") empty++;
      else errors++;
    });
    var t;
    if (!saved && !errors) { setMsg("session", "Nothing filled in yet. Enter the sets you did, then save.", "err"); render(); return; }
    t = "Saved " + saved + (saved === 1 ? " exercise" : " exercises") + (empty ? ". " + empty + " left empty, that's fine" : "") + ".";
    if (wins) t += " " + wins + (wins === 1 ? " improvement" : " improvements") + " on last time. Well done!";
    if (errors) t += " " + errors + (errors === 1 ? " needs" : " need") + " fixing: see the red message" + (errors === 1 ? "" : "s") + " above.";
    setMsg("session", t, errors ? "err" : wins ? "well" : "ok");
    if (!saved) { render(); return; }
    afterLocalSave("session", t);
  }
  function saveBody() {
    var w = num(($("#b-w") || {}).value);
    if (w == null || w <= 0 || w > 400) { setMsg("body", "Enter your weight in kg.", "err"); render(); return; }
    var prev = latestWeight();
    store.body.push({ date: todayISO(), weight: w, synced: false, seq: 1000000 + store.uid++ });
    store.body.sort(byDate); saveStore(); clearTouched(["b-w"]);
    var t = prev && w < prev.weight ? "Well done! Down " + nt(prev.weight - w) + " kg since " + shortDate(prev.date) + "." : "Saved.";
    setMsg("body", t, prev && w < prev.weight ? "well" : "ok");
    afterLocalSave("body", t);
  }
  function readMeForm() {
    var g = function (id) { var el = document.getElementById(id); return el ? el.value : ""; };
    return { name: g("m-name").trim(), sex: g("m-sex"), age: num(g("m-age")), heightCm: num(g("m-height")), activity: g("m-activity"), goal: g("m-goal") || "0" };
  }
  function updateCalc() {
    var box = $("#calc");
    if (box && $("#m-sex")) box.innerHTML = calcHtml(readCalc(Object.assign({}, store.settings, readMeForm())));
  }
  function saveSettings() {
    Object.assign(store.settings, readMeForm());
    store.settingsDirty = true; saveStore();
    clearTouched(["m-name", "m-sex", "m-age", "m-height", "m-activity", "m-goal"]);
    afterLocalSave("settings");
  }
  function saveSync() {
    var url = ($("#sync-url").value || "").trim(), key = ($("#sync-key").value || "").trim();
    if (url && !/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) { setMsg("sync", "That URL doesn't look right. It should start with https://script.google.com/ and end with /exec.", "err"); render(); return; }
    store.sync = { url: url, key: key }; saveStore(); clearTouched(["sync-url", "sync-key"]);
    if (!url) { setMsg("sync", "Disconnected. Entries are saved on this phone only.", "ok"); render(); return; }
    setMsg("sync", "Syncing…", "ok"); render();
    syncNow().then(function (ok) { setMsg("sync", ok ? "Connected and synced." : ui.syncError || "Couldn't sync.", ok ? "ok" : "err"); render(); });
  }
  function planChanged(msgKey, text) {
    store.planDirty = true; saveStore();
    if (msgKey) setMsg(msgKey, text, "ok");
    render();
    if (store.sync.url) syncNow();
  }
  function findInListActive(s, id) { return activeList(s).filter(function (e) { return e.id === id; })[0] || null; }
  function findInList(s, id) { return (store.plan[s] || []).filter(function (e) { return e.id === id; })[0] || null; }
  function swapPick(catId) {
    var sw = ui.swap, act = activeList(sw.s), cur = act.filter(function (e) { return e.id === sw.id; })[0];
    if (!cur || !CAT[catId]) return;
    var orig = cur.origId ? findInList(sw.s, cur.origId) : cur;
    if (!orig) return;
    var nid = isWarm(sw.s) && catId !== "rope-pull" ? "wu-" + catId : catId;
    var fresh = fromCat(catId, defaultStart(CAT[catId].t), "", nid), key = sw.s + "|" + orig.id;
    if (!store.daySwaps || store.daySwaps.date !== todayISO()) store.daySwaps = { date: todayISO(), map: {} };
    ui.swap = null; ui.info = null;
    var firstTime = lastLog(nid) ? "" : " Enter the weight you use the first time.";
    if (sw.mode === "today") {
      if (catId === orig.cat) delete store.daySwaps.map[key];
      else { fresh.origId = orig.id; fresh.tempFor = orig.name; store.daySwaps.map[key] = fresh; }
      setMsg(exKey(sw.s, catId === orig.cat ? orig : fresh), catId === orig.cat ? "Back to your usual exercise." : "Swapped for today." + (fresh.noW ? "" : firstTime), "ok");
      saveStore(); render();
      return;
    }
    var list = store.plan[sw.s], i = list.indexOf(orig);
    if (i < 0 || list.some(function (e) { return e.id === nid; })) return;
    list[i] = fresh;
    delete store.daySwaps.map[key];
    if (sw.s === "WX" && store.settings.warmChoice === orig.id) store.settings.warmChoice = nid;
    setMsg(exKey(sw.s, fresh), "Swapped in for " + orig.name + ". You can swap back any time." + firstTime, "ok");
    planChanged();
  }
  function applyPlan(s) {
    var sug = suggestion(s, true);
    if (!sug || !sug.swaps) return;
    sug.swaps.forEach(function (w) {
      var list = store.plan[s], i = list.indexOf(w.from);
      if (i >= 0) list[i] = fromCat(w.to.id, defaultStart(w.to.t));
    });
    store.settings.planStart = todayISO(); store.settings.dismissUntil = ""; store.settingsDirty = true;
    ui.forceSuggest = null;
    planChanged("plan", "New plan saved for " + sessionName(s) + ".");
  }

  /* ---------- rest timer ---------- */
  var restTimer = null, audioCtx = null;
  function beep() {
    try {
      if (!audioCtx) return;
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.4);
    } catch (e) { /* no sound */ }
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { /* none */ }
  }
  function startRest(secs) {
    try { if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    ui.rest = { end: Date.now() + secs * 1000 };
    if (restTimer) clearInterval(restTimer);
    restTimer = setInterval(tickRest, 250);
    render();
  }
  function tickRest() {
    if (!ui.rest || !ui.rest.end) { clearInterval(restTimer); restTimer = null; return; }
    if (Date.now() >= ui.rest.end) { clearInterval(restTimer); restTimer = null; ui.rest = { done: true }; beep(); render(); return; }
    var el = $("#rest-text");
    if (el) el.textContent = "Rest " + restText();
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!b || b.disabled) return;
    if (b.classList.contains("overlay") && e.target !== b) return; // clicks inside the info sheet
    var a = b.getAttribute("data-act"), v = b.getAttribute("data-v"), s = b.getAttribute("data-s"), i = Number(b.getAttribute("data-i"));
    if (a === "tab") { ui.tab = v; ui.sel = null; window.scrollTo && window.scrollTo(0, 0); render(); }
    else if (a === "session") { ui.session = v; render(); }
    else if (a === "save-ex") saveEx(s, v, b.getAttribute("data-sess"));
    else if (a === "save-all") saveAll();
    else if (a === "look-accent") { store.look.accent = v; saveStore(); applyLook(); render(); }
    else if (a === "look-mode") { store.look.mode = v; saveStore(); applyLook(); render(); }
    else if (a === "look-size") { store.look.size = v; saveStore(); applyLook(); render(); }
    else if (a === "look-cycle") {
      var ids = LOOK_SIZES.map(function (x) { return x[0]; }), n = (ids.indexOf(store.look.size) + 1) % ids.length;
      store.look.size = ids[n]; saveStore(); applyLook(); render();
    }
    else if (a === "reset") { ui.confirmReset = true; render(); }
    else if (a === "reset-no") { ui.confirmReset = false; render(); }
    else if (a === "reset-yes") { ui.confirmReset = false; store.plan = freshPlan(); store.settings.warmChoice = ""; ui.editing = ui.removing = ui.adding = null; planChanged("reset", "Default exercises are back."); }
    else if (a === "swap-open") { var se = findInListActive(s, v); ui.swap = { s: s, id: v, mode: "today", all: false, area: se && CAT[se.cat] ? CAT[se.cat].a : "All" }; ui.swapFocus = true; render(); }
    else if (a === "swap-mode") { ui.swap.mode = v === "keep" ? "keep" : "today"; render(); }
    else if (a === "swap-all") { ui.swap.all = true; render(); }
    else if (a === "swap-undo") { if (store.daySwaps && store.daySwaps.map) delete store.daySwaps.map[s + "|" + v]; saveStore(); render(); }
    else if (a === "swap-close") { ui.swap = null; render(); }
    else if (a === "swap-area") { ui.swap.area = v; render(); }
    else if (a === "swap-pick") swapPick(v);
    else if (a === "warm-choice") { store.settings.warmChoice = v; saveStore(); render(); }
    else if (a === "info") { ui.info = { id: v }; render(); }
    else if (a === "info-cat") { ui.info = { cat: v }; render(); }
    else if (a === "info-close") { ui.info = null; render(); }
    else if (a === "pb-close") { ui.pb = null; render(); }
    else if (a === "rest") startRest(Number(v));
    else if (a === "rest-stop") { ui.rest = null; if (restTimer) clearInterval(restTimer); render(); }
    else if (a === "save-body") saveBody();
    else if (a === "save-settings") saveSettings();
    else if (a === "save-sync") saveSync();
    else if (a === "toggle-key") { ui.showKey = !ui.showKey; render(); }
    else if (a === "install-hide") { ui.installHidden = true; render(); }
    else if (a === "chart") { ui.chart = v; ui.sel = null; render(); }
    else if (a === "metric") { ui.metric = v; ui.sel = null; render(); }
    else if (a === "chart-step") setSel((ui.sel == null ? chartPts.length - 1 : ui.sel) + Number(v));
    else if (a === "move") {
      var list = store.plan[s], j = i + Number(b.getAttribute("data-d"));
      if (j < 0 || j >= list.length) return;
      var t = list[i]; list[i] = list[j]; list[j] = t;
      planChanged();
    }
    else if (a === "edit") { ui.editing = s + ":" + i; ui.removing = null; render(); }
    else if (a === "edit-cancel") { ui.editing = null; render(); }
    else if (a === "edit-save") {
      var ex = store.plan[s][i], nm = ($("#e-name").value || "").trim();
      if (nm) ex.name = nm;
      ex.note = ($("#e-note").value || "").trim(); ex.per = $("#e-per").value; ex.type = normType($("#e-type").value);
      if ($("#e-inc")) { var inc = num($("#e-inc").value); if (inc != null && inc >= 0) ex.inc = inc; }
      ui.editing = null; clearTouched(["e-name", "e-note", "e-per", "e-type", "e-inc"]);
      planChanged("plan", ex.name + " updated.");
    }
    else if (a === "remove") { ui.removing = s + ":" + i; ui.editing = null; render(); }
    else if (a === "remove-no") { ui.removing = null; render(); }
    else if (a === "remove-yes") { var gone = store.plan[s].splice(i, 1)[0]; ui.removing = null; planChanged("plan", (gone ? gone.name : "Exercise") + " removed from " + sessionName(s) + "."); }
    else if (a === "add-open") { ui.adding = ui.adding === s ? null : s; ui.forceSuggest = null; render(); }
    else if (a === "add-close") { ui.adding = null; render(); }
    else if (a === "area") { ui.area = v; render(); }
    else if (a === "add-cat") {
      var nid = isWarm(s) && v !== "rope-pull" ? "wu-" + v : v;
      if ((store.plan[s] || []).some(function (x) { return x.id === nid; })) return;
      store.plan[s].push(fromCat(v, null, "", nid));
      planChanged("plan", CAT[v].n + " added to " + sessionName(s) + ". Enter the weight the first time you do it.");
    }
    else if (a === "add-custom") {
      var name = ($("#c-name").value || "").trim();
      if (!name) { setMsg("custom", "Give the exercise a name.", "err"); render(); return; }
      var eq = $("#c-equip").value, typ = normType($("#c-type").value);
      var st = num($("#c-start").value);
      store.plan[s].push({ id: "my-" + slug(name) + "-" + Date.now().toString(36).slice(-4), cat: "", name: name, type: typ, per: $("#c-per").value, start: typ === "reps" ? (st || 0) : defaultStart(typ), inc: eq === "Dumbbell" ? 2.5 : 2.5, note: "", equip: eq, noW: eq === "Bodyweight" || eq === "Cardio machine", how: ($("#c-how").value || "").trim() });
      clearTouched(["c-name", "c-equip", "c-type", "c-per", "c-start", "c-how"]);
      setMsg("custom", name + " added to " + sessionName(s) + ".", "ok");
      planChanged();
    }
    else if (a === "save-range") {
      var lo = num($("#p-low").value), hi = num($("#p-high").value);
      if (!lo || !hi || lo < 1 || hi < lo || hi > 50) { setMsg("plan", "Use whole numbers, with From no bigger than To.", "err"); render(); return; }
      store.settings.low = Math.round(lo); store.settings.high = Math.round(hi); store.settingsDirty = true; saveStore();
      clearTouched(["p-low", "p-high"]); setMsg("plan", "Rep range saved.", "ok"); render(); if (store.sync.url) syncNow();
    }
    else if (a === "suggest") { ui.forceSuggest = ui.forceSuggest === s ? null : s; ui.adding = null; render(); }
    else if (a === "apply-plan") applyPlan(s);
    else if (a === "dismiss-plan") {
      if (b.getAttribute("data-place") === "plan") { ui.forceSuggest = null; render(); return; }
      store.settings.dismissUntil = addDays(todayISO(), 14); store.settingsDirty = true; saveStore(); render(); if (store.sync.url) syncNow();
    }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t && t.id) ui.touched[t.id] = true;
    if (t && t.closest && t.closest("#calories")) updateCalc();
  });
  document.addEventListener("change", function (e) { var t = e.target; if (t && t.id) ui.touched[t.id] = true; if (t && t.closest && t.closest("#calories")) updateCalc(); });
  document.addEventListener("toggle", function (e) {
    if (e.target && e.target.id === "syncbox") ui.syncOpen = e.target.open;
    if (e.target && e.target.id === "ch-table") ui.tableOpen = e.target.open;
  }, true);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (ui.pb) ui.pb = null; else if (ui.info) ui.info = null; else if (ui.swap) ui.swap = null; else return;
    render();
  });
  document.addEventListener("pointerdown", chartPointer);
  document.addEventListener("pointermove", chartPointer);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    if (ui.renderedDate !== todayISO()) render();
    if (ui.rest && ui.rest.end) tickRest();
    if (store.sync.url && (!store.lastSync || Date.now() - store.lastSync > 60000)) syncNow();
  });

  /* ---------- start ---------- */
  loadStore();
  applyLook();
  if (store.planDirty) saveStore(); // keep any upgrade of older saved data
  var linked = readSetupLink();
  render();
  if (linked) { ui.tab = "workout"; }
  if (store.sync.url) syncNow();
})();
</script>
</body>
</html>
